<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGS Lab QC Report</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1d2430; --muted: #5d6878;
    --border: #dde2e8; --accent: #0f6e78; --accent-soft: #e3f1f2; --zebra: #f9fafb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --surface: #1a2028; --text: #e4e8ee; --muted: #9aa5b4;
      --border: #2c3440; --accent: #5cc3cc; --accent-soft: #17343a; --zebra: #1e252e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header, main, footer { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; border-bottom: 3px solid var(--accent); }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.01em; }
  header p { margin: 0 0 12px; color: var(--muted); }
  .meta { font-size: 0.85rem; color: var(--muted); }
  section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    margin: 20px 0; padding: 16px 18px;
  }
  section h2 { margin: 0 0 4px; font-size: 1.1rem; color: var(--accent); }
  section p.q { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left !important; }
  th { background: var(--accent-soft); font-weight: 600; position: sticky; top: 0; }
  tr:nth-child(even) td { background: var(--zebra); }
  td[align="right"] { text-align: right !important; font-family: var(--mono); font-size: 0.82rem; }
  footer { color: var(--muted); font-size: 0.8rem; padding-bottom: 32px; }
  @media (max-width: 600px) {
    body { font-size: 14px; }
    section { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>NGS Molecular Pathology Lab: Operations and QC</h1>
  <p>Synthetic data only. No PHI. Generated by <code>make report</code> from ngs-lims-postgres.</p>
